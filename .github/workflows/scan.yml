name: Intraday breakout scan

on:
  schedule:
    # Top of every hour. This is the cadence that was working before -
    # do not change it while diagnosing scheduling problems.
    - cron: "0 * * * *"
  workflow_dispatch:        # manual run from the Actions tab

concurrency:
  group: breakout-scan
  # MUST stay false. With cancel-in-progress: true, any manual run you
  # trigger also kills scheduled runs sitting in GitHub's queue - and
  # scheduled runs queue routinely under load. That is what was eating
  # the hourly runs.
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL || 'https://api.binance.com' }}

          # --- liquidity and cost gates -------------------------------
          MIN_QUOTE_VOLUME: "10000000"   # min 24h volume in USDT
          MAX_SPREAD_PCT: "0.12"         # reject anything wider
          MIN_COST_EDGE: "4.0"           # expected move / round-trip cost

          # Set to 0.075 if you pay fees in BNB, lower still for VIP tiers.
          # Several coins are currently rejected at 3.5-3.9x and would
          # qualify at a lower fee assumption.
          TAKER_FEE_PCT: "0.10"

          # 12 x 15m = 3 hour expected hold
          HOLD_CANDLES: "12"
          SHORTLIST_SIZE: "25"
        run: python scanner.py
