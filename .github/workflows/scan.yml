name: Intraday breakout scan

on:
  schedule:
    # Hourly, at 7 past to avoid the top-of-hour queue crush.
    # GitHub still drifts 5-15 min under load.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: scalp-scan
  cancel-in-progress: true      # a stale intraday scan is worthless

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL || 'https://api.binance.com' }}
          MIN_QUOTE_VOLUME: "10000000"
          MAX_SPREAD_PCT: "0.12"
          MIN_COST_EDGE: "4.0"
          TAKER_FEE_PCT: "0.10"
          HOLD_CANDLES: "12"
          SHORTLIST_SIZE: "25"
        run: python scanner.py
