name: Scalp scanner

on:
  # GitHub's own cron is unreliable on free repos — kept only as a backup.
  # cron-job.org fires the repository_dispatch below on the real schedule.
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [run-scan]
  workflow_dispatch:

concurrency:
  group: scalp-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # --- horizon -------------------------------------------------
          # 6 candles x 15m = 90 minutes. This single number controls how
          # generous every cost-edge figure is. Raising it to get more
          # alerts is self-deception, not tuning.
          HOLD_CANDLES: "6"
          INTERVAL: "15m"

          # --- costs ---------------------------------------------------
          # Set to 0.075 if you pay Binance fees in BNB.
          TAKER_FEE_PCT: "0.10"
          MIN_COST_EDGE: "4.0"

          # --- hard gates ----------------------------------------------
          MIN_QUOTE_VOL_24H: "10000000"
          MAX_SPREAD_PCT: "0.12"
          MIN_NEAR_DEPTH_USD: "25000"
          MIN_ATR_PCT: "0.15"
          MAX_ATR_PCT: "1.50"
          MIN_RVOL: "0.80"
          MAX_STOP_PCT: "1.50"
          MAX_TRIGGER_DIST_PCT: "1.20"

          # --- scope ---------------------------------------------------
          SHORTLIST_SIZE: "25"
          MAX_REPORTED: "5"
          RES_LOOKBACK_FAR: "24"
          RES_LOOKBACK_NEAR: "6"

          # --- geo fallback --------------------------------------------
          # GitHub runners are US-based and api.binance.com returns 451.
          # data-api.binance.vision is tried first and usually answers.
          BINANCE_HOSTS: "https://data-api.binance.vision,https://api-gcp.binance.com,https://api.binance.com"
        run: python scanner.py

      - name: Heartbeat
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="✅ scan ran (${{ github.event_name }}) — ${{ job.status }}" \
            > /dev/null
