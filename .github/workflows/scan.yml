name: Hourly breakout scan

on:
  schedule:
    # Every hour, on the hour (UTC). GitHub queues these, so a few
    # minutes of drift is normal and expected.
    - cron: "0 * * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

concurrency:
  group: breakout-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Carries the "already alerted" state between runs so you don't get
      # pinged about the same coin every single hour.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: scan-state-${{ github.run_id }}
          restore-keys: |
            scan-state-

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL || 'https://api.binance.com' }}
          MIN_QUOTE_VOLUME: "2000000"
          SHORTLIST_SIZE: "20"
          MIN_CRITERIA: "4"
          ALERT_COOLDOWN_HOURS: "6"
        run: python scanner.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: scan-state-${{ github.run_id }}
